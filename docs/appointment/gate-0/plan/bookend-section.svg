"1"/><circle cx="639.9" cy="400.20000000000005" r="10" fill="#f4f2e9" stroke="#00766d" stroke-width="4"/><circle cx="639.9" cy="400.20000000000005" r="3" fill="#00766d" stroke="none" stroke-width="1"/><circle cx="547.92" cy="402.09" r="10" fill="#f4f2e9" stroke="#b64621" stroke-width="4"/><circle cx="547.92" cy="402.09" r="3" fill="#b64621" stroke="none" stroke-width="1"/><circle cx="193.23000000000002" cy="669.84" r="10" fill="#f4f2e9" stroke="#00766d" stroke-width="4"/><circle cx="193.23000000000002" cy="669.84" r="3" fill="#00766d" stroke="none" stroke-width="1"/><text x="104.39999999999998" y="564.0" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#b64621" text-anchor="start" letter-spacing="0">Passenger</text><text x="644.94" y="388.23" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#00766d" text-anchor="start" letter-spacing="0">Guest</text><text x="622.89" y="518.64" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">Upper floor +3.40</text><text x="590.76" y="345.39000000000004" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">Glazing head +5.57</text><text x="321.75" y="475.8" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">Offset canopy</text><path d="M400 485 L460 506" fill="none" stroke="#8f8c76" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><text x="274.5" y="717.72" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">Kerb +0.14</text><text x="70.38" y="717.72" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">Road ±0.00</text><path d="M70 804 h36" fill="none" stroke="#b64621" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="122" y="810" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#243a36" text-anchor="start" letter-spacing="0">Car eye to the open timber screen</text><path d="M70 847 h36" fill="none" stroke="#00766d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="122" y="853" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#243a36" text-anchor="start" letter-spacing="0">Guest eye to a kerb-side wheel hub</text><path d="M70 890 h36" fill="none" stroke="#00766d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4"/><text x="122" y="896" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#243a36" text-anchor="start" letter-spacing="0">Guest eye to the lower tyre</text><text x="70" y="962" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">Dashed roof line and desk are offset in plan. Dimensions in metres.</text><circle cx="919" cy="255" r="14" fill="#243a36" stroke="none" stroke-width="1"/><text x="919" y="261" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#f4f2e9" text-anchor="middle" letter-spacing="0">1</text><text x="947" y="262" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#243a36" text-anchor="start" letter-spacing="0">Look through the door glass</text><text x="947" y="297" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">The amber ray crosses the glass at</text><text x="947" y="326" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">+1.37, inside its +0.91 to +1.43 opening.</text><text x="947" y="355" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">The side mirror sits at the eastern edge.</text><circle cx="919" cy="423" r="14" fill="#243a36" stroke="none" stroke-width="1"/><text x="919" y="429" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#f4f2e9" text-anchor="middle" letter-spacing="0">2</text><text x="947" y="430" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#243a36" text-anchor="start" letter-spacing="0">Keep the low glass clear</text><text x="947" y="465" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">At the wall face the wheel hubs cross</text><text x="947" y="494" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">at +3.82. The tyre bottoms cross at</text><text x="947" y="523" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">+3.76, above the +3.66 sill. Use fixed</text><text x="947" y="552" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">safety glass with a flush perimeter.</text><circle cx="919" cy="626" r="14" fill="#243a36" stroke="none" stroke-width="1"/><text x="919" y="632" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#f4f2e9" text-anchor="middle" letter-spacing="0">3</text><text x="947" y="633" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#243a36" text-anchor="start" letter-spacing="0">Hold the canopy to its bay</text><text x="947" y="668" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">Keep its east edge at x = 5.00. The</text><text x="947" y="697" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">nearest hub ray passes x = 5.89 at its</text><text x="947" y="726" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">outer lip. No post enters this cone.</text><circle cx="919" cy="798" r="14" fill="#243a36" stroke="none" stroke-width="1"/><text x="919" y="804" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#f4f2e9" text-anchor="middle" letter-spacing="0">4</text><text x="947" y="805" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#243a36" text-anchor="start" letter-spacing="0">Leave the desk off-axis</text><text x="947" y="840" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">Place the 0.75 m desk east of x = 6.95.</text><text x="947" y="869" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">The wheel rays remain west of x = 6.77</text><text x="947" y="898" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">across its footprint. The guest eye is</text><text x="947" y="927" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">1.20 m above the office floor.</text></svg>