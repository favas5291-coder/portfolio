"/><path d="M199.56 515.60 L209.16 569.36 L229.80 604.40 L292.20 626.00 L357.00 641.36 L405.00 657.20" fill="none" stroke="#8e9878" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4"/><circle cx="199.56" cy="514.16" r="10.08" fill="#826f4d" stroke="none" stroke-width="1"/><path d="M451.56 899.12 L444.36 866.48 L436.68 837.20 L314.76 721.04 L309.00 592.40 L332.04 527.60 L348.36 446.00 L352.20 402.80" fill="none" stroke="#8d9b8a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 6"/><path d="M453.96 901.04 L310.44 602.00" fill="none" stroke="#b64621" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 5"/><path d="M453.96 901.04 L435.72 609.68" fill="none" stroke="#b64621" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M431.40 539.60 L358.44 879.92" fill="none" stroke="#00766d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M431.40 539.60 L489.00 879.92" fill="none" stroke="#00766d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><circle cx="453.96" cy="901.04" r="10" fill="#f4f2e9" stroke="#b64621" stroke-width="4"/><circle cx="453.96" cy="901.04" r="3" fill="#b64621" stroke="none" stroke-width="1"/><circle cx="431.4" cy="539.6" r="10" fill="#f4f2e9" stroke="#00766d" stroke-width="4"/><circle cx="431.4" cy="539.6" r="3" fill="#00766d" stroke="none" stroke-width="1"/><circle cx="537.0" cy="889.04" r="13" fill="#243a36" stroke="#f4f2e9" stroke-width="2"/><text x="537.0" y="894.04" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#f4f2e9" text-anchor="middle" letter-spacing="0">1</text><circle cx="377.64" cy="574.16" r="13" fill="#243a36" stroke="#f4f2e9" stroke-width="2"/><text x="377.64" y="579.16" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#f4f2e9" text-anchor="middle" letter-spacing="0">2</text><circle cx="238.92000000000002" cy="679.28" r="13" fill="#243a36" stroke="#f4f2e9" stroke-width="2"/><text x="238.92000000000002" y="684.28" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#f4f2e9" text-anchor="middle" letter-spacing="0">3</text><circle cx="160.68" cy="552.56" r="13" fill="#243a36" stroke="#f4f2e9" stroke-width="2"/><text x="160.68" y="557.56" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#f4f2e9" text-anchor="middle" letter-spacing="0">4</text><circle cx="531.72" cy="559.28" r="13" fill="#243a36" stroke="#f4f2e9" stroke-width="2"/><text x="531.72" y="564.28" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#f4f2e9" text-anchor="middle" letter-spacing="0">5</text><circle cx="380.04" cy="316.88" r="13" fill="#243a36" stroke="#f4f2e9" stroke-width="2"/><text x="380.04" y="321.88" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700" fill="#f4f2e9" text-anchor="middle" letter-spacing="0">6</text><text x="544.6800000000001" y="474.8" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#4b635c" text-anchor="middle" letter-spacing="0">Office</text><text x="484.20000000000005" y="354.79999999999995" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#4b635c" text-anchor="middle" letter-spacing="0">Project room</text><text x="491.4" y="286.15999999999997" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#4b635c" text-anchor="middle" letter-spacing="0">Working studio</text><path d="M405.00 311.60 L575.40 311.60" fill="none" stroke="#bcc9b6" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4"/><text x="303.72" y="636.56" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#4b635c" text-anchor="middle" letter-spacing="0">Entry</text><text x="202.92000000000002" y="317.84000000000003" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#243a36" text-anchor="middle" letter-spacing="0">UP</text><text x="150.6" y="794.96" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">Wet paving</text><text x="81.96000000000001" y="923.12" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">Road</text><text x="621.96" y="854.0" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">Kerb</text><path d="M664 308 V255 l-6 12 M664 255 l6 12" fill="none" stroke="#243a36" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="664" y="245" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#243a36" text-anchor="middle" letter-spacing="0">N</text><path d="M82 971 H226 M82 964 v14 M130 964 v14 M226 964 v14" fill="none" stroke="#243a36" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="82" y="953" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#243a36" text-anchor="start" letter-spacing="0">0</text><text x="130" y="953" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#243a36" text-anchor="start" letter-spacing="0">1</text><text x="226" y="953" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#243a36" text-anchor="start" letter-spacing="0">3 m</text><text x="703" y="1019" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#4b635c" text-anchor="end" letter-spacing="0">Pale green dashed outlines mark the upper floor.</text><circle cx="762" cy="243" r="14" fill="#243a36" stroke="none" stroke-width="1"/><text x="762" y="249" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#f4f2e9" text-anchor="middle" letter-spacing="0">1</text><text x="790" y="250" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#243a36" text-anchor="start" letter-spacing="0">Passenger seat</text><text x="790" y="285" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">Eye 1.13 m above the road. A 4.30 × 1.76 m car</text><text x="790" y="314" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">sits 0.32 m off the kerb. The 1.45 m door</text><text x="790" y="343" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">swings to 68° around its front hinge.</text><circle cx="762" cy="382" r="14" fill="#243a36" stroke="none" stroke-width="1"/><text x="762" y="388" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#f4f2e9" text-anchor="middle" letter-spacing="0">2</text><text x="790" y="389" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#243a36" text-anchor="start" letter-spacing="0">One open screen leaf</text><text x="790" y="424" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">Fixed timber screens flank a 1.29 m</text><text x="790" y="453" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">clear central opening. The open leaf at the</text><text x="790" y="482" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">east jamb reads in both directions.</text><circle cx="762" cy="521" r="14" fill="#243a36" stroke="none" stroke-width="1"/><text x="762" y="527" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#f4f2e9" text-anchor="middle" letter-spacing="0">3</text><text x="790" y="528" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#243a36" text-anchor="start" letter-spacing="0">Canopy and kerb</text><text x="790" y="563" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">Set the 2.20 m wide canopy west of the window.</text><text x="790" y="592" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">Its 1.80 m projection shades the entry without</text><text x="790" y="621" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">crossing the view to either wheel.</text><circle cx="762" cy="660" r="14" fill="#243a36" stroke="none" stroke-width="1"/><text x="762" y="666" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#f4f2e9" text-anchor="middle" letter-spacing="0">4</text><text x="790" y="667" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#243a36" text-anchor="start" letter-spacing="0">Tree and stair</text><text x="790" y="702" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">An open court receives the mature trunk. One</text><text x="790" y="731" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">limb bends over the pavement. A half-landing</text><text x="790" y="760" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">returns to the same tree above the project table.</text><circle cx="762" cy="799" r="14" fill="#243a36" stroke="none" stroke-width="1"/><text x="762" y="805" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#f4f2e9" text-anchor="middle" letter-spacing="0">5</text><text x="790" y="806" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#243a36" text-anchor="start" letter-spacing="0">Guest chair</text><text x="790" y="841" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">Offset the desk to the east of the guest. The</text><text x="790" y="870" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">monitor and plate stay in the left-hand field.</text><text x="790" y="899" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">The low sill reveals the car along its full length.</text><circle cx="762" cy="938" r="14" fill="#243a36" stroke="none" stroke-width="1"/><text x="762" y="944" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#f4f2e9" text-anchor="middle" letter-spacing="0">6</text><text x="790" y="945" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#243a36" text-anchor="start" letter-spacing="0">Project table</text><text x="790" y="980" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">Keep this table beyond the upper slab edge so</text><text x="790" y="1009" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">the landing still looks down into reception.</text></svg>