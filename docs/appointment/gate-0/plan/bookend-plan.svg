<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1060" viewBox="0 0 1480 1060"><rect x="0" y="0" width="1480" height="1060" rx="0" fill="#f4f2e9" stroke="none" stroke-width="1" /><text x="52" y="51" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#243a36" text-anchor="start" letter-spacing="2">FAZHERE  /  STUDIO</text><text x="1432" y="51" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#4b635c" text-anchor="end" letter-spacing="1">GATE 0   /   PLAN</text><path d="M52 73 H1430" fill="none" stroke="#a9b6a9" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /><text x="50" y="139" font-family="DejaVu Sans,sans-serif" font-size="51" font-weight="700" fill="#243a36" text-anchor="start" letter-spacing="0">One kerb, one upstairs window</text><text x="53" y="176" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#4b635c" text-anchor="start" letter-spacing="0">Ground and upper floor share one coordinate grid. The car faces east with its passenger door on the kerb side.</text><rect x="52" y="212" width="665" height="789" rx="0" fill="#e8eadf" stroke="none" stroke-width="1" /><rect x="54.599999999999994" y="866.0" width="657.6" height="129.59999999999997" rx="0" fill="#cad4cd" stroke="none" stroke-width="1" /><rect x="54.599999999999994" y="602" width="660.0" height="264.0" rx="0" fill="#e4e4d6" stroke="none" stroke-width="1" /><path d="M54.60 866.00 L712.20 866.00" fill="none" stroke="#89988e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><rect x="117" y="254.0" width="489.59999999999997" height="348.0" rx="0" fill="#f6f5eb" stroke="#243a36" stroke-width="4" /><rect x="118.44" y="421.52" width="150.24" height="179.04" rx="0" fill="#d3dfc8" stroke="none" stroke-width="1" /><path d="M118.92 602.00 L267.24 602.00" fill="none" stroke="#d3dfc8" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" /><rect x="227.39999999999998" y="256.4" width="