# Reference configuration. An existing Dashboard-managed service does not
# automatically adopt this file: apply the settings in docs/SEO-DEPLOY.md.
services:
  - type: web
    name: portfolio-1
    runtime: static
    buildCommand: npm ci --include=dev && node scripts/set-site-url.mjs https://fazhere.com && npm run verify
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: SITE_ENV
        value: production
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    # No /* -> /index.html rewrite: every public page is a real HTML file.
    # Leave missing URLs to Render's genuine 404 response.
