name: Unified CRM verification
on:
  pull_request:
    paths:
      - "apps/unified-crm/**"
      - ".github/workflows/unified-crm.yml"
  workflow_dispatch:
jobs:
  crm:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/unified-crm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install standalone CRM dependencies
        run: npm install --no-audit --no-fund
      - name: Run lead model tests
        run: npm test
      - name: Run authenticated MongoDB API integration
        env:
          CRM_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/unified_crm_ci
        run: npm run test:integration
      - name: Validate backend JavaScript syntax
        run: |
          node --check server/index.cjs
          node --check server/models/Lead.cjs
      - name: Build React CRM
        run: npm run build
