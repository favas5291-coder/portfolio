name: Afterlight visual review

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'package*.json'
      - 'scripts/capture-cinematic.mjs'
      - 'scripts/build-afterlight-preview.mjs'
      - '.github/workflows/cinematic-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run verify
      - name: Check out comparison baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: .sites-runtime/baseline
          persist-credentials: false
      - name: Build baseline from its own lockfile
        working-directory: .sites-runtime/baseline
        run: npm ci && npm run build
      - name: Install browser and recording tooling on the runner
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Package review preview for offline use
        run: node scripts/build-afterlight-preview.mjs
      - name: Run browser checks and compare head with base
        env:
          BASELINE_URL: http://127.0.0.1:4174/
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          npm run preview -- --host 127.0.0.1 --strictPort > /tmp/fazhere-afterlight.log 2>&1 &
          (cd .sites-runtime/baseline && npm run preview -- --host 127.0.0.1 --port 4174 --strictPort) > /tmp/fazhere-before.log 2>&1 &
          node scripts/capture-cinematic.mjs
      - name: Upload review bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fazhere-afterlight-review
          path: visual-checks/
          if-no-files-found: error
