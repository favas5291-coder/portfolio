name: Fazhere Editions visual review

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'package*.json'
      - 'scripts/capture-cinematic.mjs'
      - 'scripts/build-fit-preview.mjs'
      - '.github/workflows/cinematic-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run verify
      - name: Check out comparison baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: .sites-runtime/baseline
          persist-credentials: false
      - name: Build baseline from its own lockfile
        working-directory: .sites-runtime/baseline
        run: npm ci && npm run build
      - name: Use the runner's Chrome and prepare video capture
        run: |
          npm install --prefix "$RUNNER_TEMP/editions-tools" --no-audit --no-fund playwright@1.56.1 @ffmpeg-installer/linux-x64@4.1.0
          ln -s "$RUNNER_TEMP/editions-tools/node_modules/playwright" node_modules/playwright
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          "$chrome_path" --version
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
          ffmpeg_path="$(command -v ffmpeg || echo "$RUNNER_TEMP/editions-tools/node_modules/@ffmpeg-installer/linux-x64/ffmpeg")"
          ffmpeg_rev="$(node -p "require(process.env.RUNNER_TEMP + '/editions-tools/node_modules/playwright-core/browsers.json').browsers.find(b => b.name === 'ffmpeg').revision")"
          tool_cache="$RUNNER_TEMP/editions-browsers"
          mkdir -p "$tool_cache/ffmpeg-$ffmpeg_rev"
          ln -s "$ffmpeg_path" "$tool_cache/ffmpeg-$ffmpeg_rev/ffmpeg-linux"
          echo "PLAYWRIGHT_BROWSERS_PATH=$tool_cache" >> "$GITHUB_ENV"
          echo "FFMPEG_PATH=$ffmpeg_path" >> "$GITHUB_ENV"
      - name: Package review preview for offline use
        run: |
          node scripts/build-fit-preview.mjs
          python -m zipfile -c visual-checks/Fazhere-Editions-production.zip dist
      - name: Run browser checks and compare head with base
        env:
          BASELINE_URL: http://127.0.0.1:4174/
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          npm run preview -- --host 127.0.0.1 --strictPort > /tmp/fazhere-editions.log 2>&1 &
          (cd .sites-runtime/baseline && npm run preview -- --host 127.0.0.1 --port 4174 --strictPort) > /tmp/fazhere-before.log 2>&1 &
          node scripts/capture-cinematic.mjs
      - name: Upload review bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fazhere-editions-review
          path: visual-checks/
          if-no-files-found: error
