name: Fazhere Studio visual review

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'package*.json'
      - 'index.html'
      - 'scripts/review-studio.mjs'
      - 'scripts/build-fit-preview.mjs'
      - '.github/workflows/cinematic-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run verify
      - name: Package the standalone review preview
        run: node scripts/build-fit-preview.mjs visual-checks/Fazhere-Studio-Preview.html
      - name: Prepare visual test browsers
        run: |
          npm install --prefix "$RUNNER_TEMP/studio-tools" --no-audit --no-fund playwright@1.62.1
          ln -s "$RUNNER_TEMP/studio-tools/node_modules/playwright" node_modules/playwright
          "$RUNNER_TEMP/studio-tools/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Test visitor journeys and record room views
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          npm run preview -- --host 127.0.0.1 --strictPort > "$RUNNER_TEMP/fazhere-studio.log" 2>&1 &
          curl --retry 18 --retry-delay 1 --retry-connrefused --fail --silent --output /dev/null http://127.0.0.1:4173/
          node scripts/review-studio.mjs
      - name: Upload screenshots and measured results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fazhere-studio-review
          path: visual-checks/
          if-no-files-found: error
