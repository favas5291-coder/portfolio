name: Appointment browser review

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'demos/**'
      - 'package*.json'
      - 'index.html'
      - 'vite.config.js'
      - 'scripts/**'
      - '.github/workflows/cinematic-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run verify
      - name: Prepare Chromium and WebKit
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-audit --no-fund playwright@1.62.1
          ln -s "$RUNNER_TEMP/browser-tools/node_modules/playwright" node_modules/playwright
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Exercise the production build
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          npm run preview > "$RUNNER_TEMP/appointment-preview.log" 2>&1 &
          curl --retry 18 --retry-delay 1 --retry-connrefused --fail --silent --output /dev/null http://127.0.0.1:4173/
          node scripts/review-appointment.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appointment-browser-review
          path: visual-checks/
          compression-level: 0
          if-no-files-found: error
